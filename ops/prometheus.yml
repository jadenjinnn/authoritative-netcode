global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: netcode-server
    static_configs:
      # The measured server runs natively on the WSL host (not in a container), so
      # the latency path never crosses Docker's NAT. host.docker.internal resolves to
      # the host via the extra_hosts mapping in docker-compose.yml.
      - targets: ["host.docker.internal:8080"]
